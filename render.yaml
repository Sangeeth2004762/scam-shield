services:
  - type: web
    name: scam-shield-api
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - key: GEMINI_API_KEY
        sync: false
